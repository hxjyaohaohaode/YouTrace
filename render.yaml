# Production candidate: PAID API + PAID persistent disk, free static frontend.
# Do not Apply without cost approval, verified restore and actual service URLs.
# Pure-free frontend-only alternative: deploy/render/free-static.yaml.
# API refuses startup without the declared mounted disk; never ephemeral SQLite.
# Auto Sync is a separate Blueprint setting and must remain No until authorized.
services:
  - type: web
    name: youji-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: 'off'
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: youtrace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '10000'
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_PROVIDER_TOKEN
        sync: false
      - key: DATA_DIR
        value: /var/data/youtrace
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: DATABASE_URL
        value: file:/var/data/youtrace/youtrace.sqlite3
      - key: DEV_OTP_EXPOSE
        value: 'false'
      # Set true manually ONLY for an approved, empty installation; then remove.
      - key: YOU_TRACE_INITIALIZE_EMPTY
        value: 'false'
      - key: SERVER_AI_ENABLED
        value: 'false'
      # Optional: add AI_CREDENTIAL_ENCRYPTION_KEY for account-owned BYOK storage.
      # Optional basic chat: SERVER_AI_API_KEY / SERVER_AI_BASE_URL / SERVER_AI_MODEL.
      # No generated credentials or implicit provider/model defaults.

  - type: web
    name: youtrace
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: cd youji-app && node scripts/validate-static-api.mjs && npm ci && npm run build
    staticPublishPath: youji-app/dist
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: "/*"
        name: X-Content-Type-Options
        value: "nosniff"
      - path: "/*"
        name: X-Frame-Options
        value: "DENY"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=(self)"
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
