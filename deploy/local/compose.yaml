name: youtrace-local
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: api
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /data
      DATABASE_URL: file:/data/youtrace.sqlite3
      DEV_OTP_EXPOSE: 'false'
      TRUST_PROXY: 'false'
      YOU_TRACE_INITIALIZE_EMPTY: ${YOU_TRACE_INITIALIZE_EMPTY:-false}
    volumes:
      - data:/data
      - backups:/backups
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  web:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: web
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./tls:/etc/youtrace/tls:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  data:
  backups:
