name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youji-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            youji-app/package-lock.json
            youji-app/server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: youji-app/server
      - run: npm run db:generate
        working-directory: youji-app/server
      - name: Frontend lint, types, build and data recovery regressions
        run: npm run lint && npm run build && npm test
      - name: Backend lint, build, auth and synchronization regressions
        run: npm run check
        working-directory: youji-app/server
      - name: All dependency audit
        run: npm audit --audit-level=high && npm --prefix server audit --audit-level=high
      - name: Install Chinese screenshot fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chromium HTTP, IndexedDB and responsive recovery flows
        run: npm run test:browser
        env:
          AUDIT_BROWSER_PATH: /usr/bin/google-chrome
      - name: Browser evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtrace-browser-evidence-${{ github.sha }}
          path: youji-app/test-artifacts/
          if-no-files-found: warn
          retention-days: 14

  user_outcomes_baseline:
    name: Independent user-outcome baseline (product gaps remain red)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youji-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify the audited application has not changed
        working-directory: .
        run: |
          unexpected=$(git diff --name-only e0da837068b26eca3b95bfcb952c825b998a1dee HEAD | grep -vE '^(\.github/workflows/ci\.yml|youji-app/scripts/audit-user-outcomes\.mjs)$' || true)
          test -z "$unexpected" || { printf '%s\n' "$unexpected"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            youji-app/package-lock.json
            youji-app/server/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix server run db:generate
      - run: npm run build && npm --prefix server run build
      - name: Install recording and Chinese-font prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Operate fresh Y1 and Y2 tasks through actual controls
        run: node scripts/audit-user-outcomes.mjs
        env:
          AUDIT_BROWSER_PATH: /usr/bin/google-chrome
      - name: Preserve successful and failed task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtrace-user-outcome-baseline-${{ github.sha }}
          path: youji-app/test-artifacts/user-outcomes/
          if-no-files-found: error
          retention-days: 14
