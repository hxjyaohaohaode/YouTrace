name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_unsupported_habit_history:
        description: Run archived future-effective habit/history diagnostic (expected gaps remain red)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youji-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            youji-app/package-lock.json
            youji-app/server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: youji-app/server
      - run: npm run db:generate
        working-directory: youji-app/server
      - name: Frontend lint, types, build and data recovery regressions
        run: npm run lint && npm run build && npm test
      - name: Backend lint, build, auth and synchronization regressions
        run: npm run check
        working-directory: youji-app/server
      - name: All dependency audit
        run: npm audit --audit-level=high && npm --prefix server audit --audit-level=high
      - name: Install Chinese screenshot fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real Chromium HTTP, IndexedDB and responsive recovery flows
        run: npm run test:browser
        env:
          AUDIT_BROWSER_PATH: /usr/bin/google-chrome
      - name: Browser evidence (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtrace-browser-evidence-${{ github.sha }}
          path: youji-app/test-artifacts/
          if-no-files-found: warn
          retention-days: 14

  user_outcomes:
    name: Real user outcomes (${{ matrix.task_set }}, independent review required)
    strategy:
      fail-fast: false
      matrix:
        task_set: [records, coach, planning, habits, habits-frequency, goals, legacy-goals-enrollment, legacy-goals-source, initial-session, startup-recovery, preferences-normal, preferences-write, preferences-read, preferences-conflict, expense-records, expense-budget, diary-records, diary-recovery, todo-records, keyboard-records, capture-return]
    # Independent evidence must still run when another browser regression fails.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youji-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve original brand assets and entry animation
        working-directory: .
        run: git diff --exit-code e0da837068b26eca3b95bfcb952c825b998a1dee HEAD -- youji-app/src/components/ui/SplashScreen.tsx youji-app/src/pages/Login.tsx youji-app/src/assets
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            youji-app/package-lock.json
            youji-app/server/package-lock.json
      - run: npm ci && npm --prefix server ci && npm --prefix server run db:generate
      - run: npm run build && npm --prefix server run build
      - name: Install recording and Chinese-font prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk ffmpeg
      - name: Check recording, Chinese font and browser prerequisites
        run: timeout --signal=TERM --kill-after=2s 45s bash scripts/recording-prereq-probe.sh
      - name: Operate bounded native user-task evidence (${{ matrix.task_set }})
        # Leave job time for preserving raw evidence if the browser harness hangs.
        timeout-minutes: 8
        run: node scripts/audit-user-outcomes.mjs
        env:
          AUDIT_TASK_SET: ${{ matrix.task_set }}
          AUDIT_INCLUDE_UNSUPPORTED_HABIT_HISTORY: ${{ inputs.include_unsupported_habit_history && 'true' || 'false' }}
          AUDIT_BROWSER_PATH: /usr/bin/google-chrome
      - name: Package all successful and failed evidence without dropping bytes
        if: always()
        run: node scripts/package-outcome-evidence.mjs
      - name: Task summary and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtrace-outcome-summary-${{ matrix.task_set }}-${{ github.sha }}
          path: |
            youji-app/test-artifacts/user-outcomes/outcome-report.json
            youji-app/test-artifacts/user-outcomes/progress-checkpoint.json
            youji-app/test-artifacts/user-outcomes/INCOMPLETE.txt
            youji-app/test-artifacts/user-outcomes/README.txt
            youji-app/test-artifacts/outcome-package/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Raw evidence part 00
        if: always() && hashFiles('youji-app/test-artifacts/outcome-package/evidence.part-00') != ''
        uses: actions/upload-artifact@v4
        with:
          name: youtrace-outcome-part-00-${{ matrix.task_set }}-${{ github.sha }}
          path: youji-app/test-artifacts/outcome-package/evidence.part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Raw evidence part 01
